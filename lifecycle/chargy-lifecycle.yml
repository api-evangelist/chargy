generated: '2026-07-27'
method: probed
source: >-
  Live probes of https://char.gy/open-ocpi/*, https://char.gy/ocpi/cpo/* and the
  char.gy help centre, 2026-07-27
versioning:
  open_feed:
    scheme: none
    detail: >-
      No version is declared anywhere on the open data feed. GET
      /open-ocpi/versions returns 404, so the OCPI version-negotiation mechanism
      is not implemented, and the payload shape is the only contract. There is
      no version in the path, no version header and no media-type versioning.
  cpo_roaming:
    scheme: uri-path
    supported: ['2.2.1', '2.1.1']
    rejected: ['2.2']
    evidence: >-
      /ocpi/cpo/2.2.1/locations and /ocpi/cpo/2.1.1/locations return HTTP 401
      (real, credential-gated routes) while /ocpi/cpo/2.2/credentials returns
      status_code 3002 "Unsupported version" — so version support is directly
      observable without a credential.
    versions_endpoint: https://char.gy/ocpi/cpo/versions
    versions_endpoint_status: 401
