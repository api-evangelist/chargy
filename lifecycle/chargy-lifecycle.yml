deprecated_operations: []
status_page:
  url: null
  published: false
  detail: >-
    status.char.gy does not resolve and https://char.gy/status returns 404. No
    uptime or incident-history page was found, so no StatusPage pointer is
    wired. Per-charge-point availability is, however, effectively self-reporting
    through the EVSE status field on /open-ocpi/locations, which regulation
    10(4) requires to be updated within 30 seconds of a change.
sla:
  url: null
  uptime_target: null
  detail: >-
    No SLA is published for either API. The statutory obligation in regulation
    10 is on data availability, not on API uptime, and char.gy makes no
    availability commitment to data consumers.
