aid: chargy
name: char.gy
review:
  question: >-
    Britain mandated the infrastructure, not the data right. There is no UK
    equivalent of the Consumer Data Right for energy — no accreditation regime,
    no consumer data holder register, no standardised retailer contract. So when
    a British organization at the very end of the wire does publish an open,
    anonymous, standards-shaped API, what actually produced it: a voluntary
    developer strategy, or a different mandate pointed at a different kind of
    data?
  answer: true
  date: '2026-07-27'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  tier: ev-charging
  summary: >-
    A different mandate, and it is the sharpest example in this sector of a
    mandate being an implementation. char.gy publishes a genuinely open,
    genuinely anonymous OCPI-shaped Locations and Tariffs feed at
    https://char.gy/open-ocpi/locations and https://char.gy/open-ocpi/tariffs.
    Both returned HTTP 200 with application/json to a request carrying no
    credential of any kind on 2026-07-27, with 5,409 locations behind
    limit/offset pagination. That is not developer relations. It is Part 4
    regulation 10(5) of the Public Charge Point Regulations 2023, which requires
    reference data and availability data to be published free of charge, machine
    readable, and — the clause that does the real work — "without any
    requirement to agree to terms and conditions regarding the use of that
    data". The statute made the gate illegal, so there is no gate. Set against
    that, the consumer side is empty: no API exposes an individual driver's
    charging usage or billing data to that driver or to anyone acting for them,
    because Britain never wrote that obligation. And the commercial roaming
    surface is closed: /ocpi/cpo/ returned 401 with
    `www-authenticate: Token realm="OCPI"`. One company, three postures, each
    one exactly as open as the law made it.

mandate:
  regime: other
  regimeName: >-
    The Public Charge Point Regulations 2023 (SI 2023/1168), Part 4 "Open public
    charge point data", regulation 10 "Data", made under the Automated and
    Electric Vehicles Act 2018 and enforced by the Secretary of State for
    Transport.
  regimeVerbatim: >-
    Regulation 10(5), read from
    https://www.legislation.gov.uk/uksi/2023/1168/regulation/10/made (HTTP 200,
    fetched 2026-07-27): "A charge point operator must ensure that reference
    data and availability data is made available to the public free of charge
    and in a machine readable format without any requirement to agree to terms
    and conditions regarding the use of that data." Regulation 10(6)(d) defines
    reference data as information that does not change frequently about a charge
    point "including but not limited to (i) the location of the charge point;
    (ii) the type of connector available to charge an electric vehicle at the
    charge point; (iii) the methods by which a person is able to pay to charge
    an electric vehicle at the charge point; (iv) the price in pence per
    kilowatt hour to charge an electric vehicle at the charge point; and (v) the
    hours of the day during which the charge point is unavailable to charge an
    electric vehicle." Regulation 10(6)(a) defines availability data as
    "information about whether a charge point is working and, for these
    purposes, 'working' means that the charge point has an EVSE object status of
    available, charging or reserved". Regulation 10(4) requires EVSE object
    status data to be updated "within 30 seconds of a change".
  status: live-implemented
  statusReasoning: >-
    Recorded as live-implemented rather than live-claimed-unverified because the
    claim and the implementation were verified separately and the implementation
    stands on its own. char.gy makes the claim in a Freshdesk help-centre
    article: "Char.gy complies with the Public Charge Point Regulations 2023 by
    making the necessary open data available via OCPI." That sentence alone
    would have been worth nothing here. What promotes this to live-implemented
    is that the two endpoints the article names were then called anonymously
    from a client with no account, no token, no cookie and no referer, and both
    returned HTTP 200 with application/json, an OCPI success envelope
    (status_code 1000), and thousands of real records — 5,409 locations by the
    x-total-count header. Every element regulation 10(6)(d) enumerates is
    present in the payload: location coordinates and postal address, connector
    type IEC_62196_T2, price in currency per kWh in the tariffs module linked
    per-connector by tariff_ids, and opening_times. The "without any requirement
    to agree to terms and conditions" clause is satisfied observably — no
    click-through, no licence page, no registration, no API key, and no 403 on
    an unattributed request.
  claimVsImplementation: >-
    The distinction this whole exercise exists to draw is unusually easy to make
    here and worth stating plainly. The compliance statement is one sentence in
    a support article with no version, no schema, no rate limit and no changelog
    — as a document it is the weakest kind of evidence. The endpoints are the
    strongest kind. The verdict rests entirely on the second, and would have
    been live-claimed-unverified on the first alone.
  implementationFidelityNote: >-
    Conformant in substance, loose in detail. The observed EVSE status values
    across a 600-location sample were WORKING (586) and FAULTED (14). Neither
    appears in the OCPI 2.2.1 EVSEStatus enumeration, which was checked directly
    against
    https://raw.githubusercontent.com/ocpi/ocpi/release-2.2.1-bugfixes/mod_locations.asciidoc
    (HTTP 200) and lists AVAILABLE, BLOCKED, CHARGING, INOPERATIVE, OUTOFORDER,
    PLANNED, REMOVED, RESERVED and UNKNOWN. The likely explanation is visible in
    the statute rather than the standard: regulation 10(6)(a) defines the
    regulated concept as whether a charge point is "working". char.gy appears to
    have encoded the regulator's availability vocabulary inside an OCPI
    envelope. That is a real and interesting artefact of a mandate landing on
    top of an industry standard — the law reshaped the payload — and it is
    recorded as an observation, not corrected.
  dataQualityObservation: >-
    Of the three tariff objects published, one declares currency GBP with a
    genuine weekday-offpeak / weekday-peak / weekend time-of-day structure
    (0.325, 0.4917 and 0.45 per kWh), one declares currency EUR at 0.5505 and
    one declares currency USD at 0.4167 — all three with country_code GB and
    party_id CGY, and the EUR and USD records last_updated in October 2025. This
    is recorded as observed, not interpreted. It is the kind of thing an open
    mandate surfaces and a closed API hides.
  otherRegimesChecked:
    cdrEnergy: >-
      Not applicable. The Consumer Data Right is Australian law; char.gy
      operates only in the United Kingdom and the Republic of Ireland. Britain
      has no statutory consumer data-portability right for energy — no
      accreditation regime, no data holder register, no Data Standards Body
      energy schemas, nothing structurally equivalent.
    greenButtonOntario: >-
      Not applicable — Ontario regulation, no char.gy presence in Canada.
    greenButtonVoluntary: >-
      No reference to Green Button, ESPI or IEEE 2030.5 was found on any char.gy
      surface. The full sitemap at https://char.gy/sitemap.xml was retrieved and
      contains no such page, and the help centre search for the terms returned
      only the Public Charge Point Regulations article.
    smartMeterInfrastructure: >-
      Not applicable to this organization, though it is the defining UK regime
      one layer up. The Smart DCC is the licensed monopoly carrying smart-meter
      traffic in Great Britain and it is an infrastructure mandate, not a
      consumer data right. char.gy is not a supplier, not a network operator and
      not a metering agent; it holds no smart meter data and appears nowhere in
      that regime.
    ukConsumerEnergyDataRight: >-
      Does not exist. This is the finding that matters for the UK entries in
      this sector and it is recorded here explicitly so it is never implied
      away: there is no British statute that gives an energy or EV-charging
      customer a right to have their own consumption or billing data delivered
      to a third party through a standardised API. Britain mandated open
      infrastructure data and left consumer data alone.

dataStandard:
  primary: >-
    OCPI — Open Charge Point Interface. Locations and Tariffs modules on the
    open feed; Locations, Tariffs, Sessions, CDRs and Credentials modules on the
    gated CPO roaming interface.
  primaryEvidence: >-
    Named by char.gy itself. The help-centre article at
    https://help.char.gy/support/solutions/articles/77000576948-public-charge-point-regulations-2023
    (HTTP 200, anonymous, fetched 2026-07-27) reads in full: "Char.gy complies
    with the Public Charge Point Regulations 2023 by making the necessary open
    data available via OCPI. OCPI is an open standard for which the
    documentation can be found at https://github.com/ocpi/ocpi. The URL host is
    https://char.gy. The locations endpoint path is /open-ocpi/locations. The
    tariffs endpoint path is /open-ocpi/tariffs. If you still require support
    then please contact us by emailing support@char.gy." Nothing above was
    inferred; that is the entire published documentation for the API.
  versionDeclared: false
  versionNote: >-
    The open feed declares no OCPI version. GET /open-ocpi/versions returned 404,
    so there is no version negotiation endpoint and no way for a client to
    discover which release it is talking to. The payload shape is 2.2-family —
    it carries parking_type, publish, party_id and country_code at the location
    level and capabilities and evse_id at the EVSE level — but char.gy makes no
    claim and none is made here on its behalf. The gated CPO interface DOES
    reveal its supported versions indirectly: GET /ocpi/cpo/2.2/credentials
    returned HTTP 200 with {"status_code":3002,"status_message":"Unsupported
    version"} while /ocpi/cpo/2.2.1/credentials and /ocpi/cpo/2.1.1/credentials
    returned 401, which places the roaming interface on OCPI 2.2.1 and 2.1.1
    with 2.2 explicitly refused.
  secondary: >-
    None. There is no OpenAPI, no AsyncAPI, no GraphQL schema, no JSON Schema
    and no Postman collection published anywhere on char.gy — /openapi.json,
    /swagger.json and /api-docs all returned 404, and no spec file is served
    alongside the open-ocpi endpoints.
  notFound:
  - Green Button / ESPI — no reference found on any char.gy surface
  - CDR Consumer Data Standards — not applicable, UK organization
  - OpenADR — no reference found
  - IEEE 2030.5 — no reference found
  - IEC CIM 61968 / 61970 — no reference found
  - >-
    OCPP — no public reference found. char.gy almost certainly speaks OCPP
    southbound to its own charge points, but nothing public documents it, no
    version is claimed, and none is claimed here.

consumerVsMarketData:
  finding: >-
    A clean inversion of the pattern this sector usually produces. Where a
    mandated retailer is forced open on consumer data and often publishes
    nothing on market data, char.gy is forced open on infrastructure data and
    publishes literally nothing on consumer data. The two halves do not touch,
    they are governed by different instruments, and one of those instruments
    does not exist in this country.
  consumerDataApi: false
  consumerDataDetail: >-
    No. There is no API through which an individual driver's charging sessions,
    kWh consumption, cost or invoices can be obtained — not by that driver and
    not by a third party acting for them. The driver surface is a mobile app on
    iOS and Android and a Rails web account at https://char.gy/users/sign_in;
    /account/ and /users/ are disallowed in robots.txt and no documented API sits
    behind them. There is no OAuth 2.0 authorization server and no OpenID
    Connect discovery document —
    https://char.gy/.well-known/openid-configuration returned 404 — so there is
    no delegation mechanism at all, and therefore no technical means by which
    consent-based third-party access could even be granted. The OCPI Sessions
    and CDRs modules on the gated /ocpi/cpo/ interface do move an identified
    driver's session and cost records, but that is inter-operator roaming
    settlement under a commercial agreement, the counterparty is another network
    rather than the driver, and the driver is not a party to the exchange.
  marketDataOpen: true
  marketDataDetail: >-
    Yes, and unusually completely. Two anonymous endpoints, both HTTP 200,
    both application/json, both returning production data with no credential of
    any kind. GET https://char.gy/open-ocpi/locations returned 50,804 bytes with
    headers x-total-count 5409, x-limit 50 and
    link <https://char.gy/open-ocpi/locations?limit=50&offset=50>; rel="next";
    600 locations were sampled across offsets 0 to 550 and every one carried the
    full documented shape. GET https://char.gy/open-ocpi/tariffs returned 1,232
    bytes with x-total-count 3. Coverage is national rather than promotional:
    the 600-location sample alone spanned 67 distinct city values including
    Haringey, Southwark, Coventry, Brighton, Harrow, Cricklewood, Crouch End,
    Dulwich, Amersham, Chesham and High Wycombe, and each location names the
    owning local authority in an owner block. What is deliberately absent is
    everything the regulation does not compel — /open-ocpi/sessions,
    /open-ocpi/cdrs, /open-ocpi/tokens, /open-ocpi/commands and
    /open-ocpi/credentials all returned 404. The open surface is exactly the
    size of the statute, to the module.
  provenOpposition:
  - call: GET https://char.gy/open-ocpi/locations (no auth, no cookie)
    httpStatus: 200
    note: 5,409 locations, application/json, statutory open data. Nothing is gated.
  - call: GET https://char.gy/open-ocpi/tariffs (no auth, no cookie)
    httpStatus: 200
    note: 3 tariffs including a real time-of-day GBP price structure.
  - call: GET https://char.gy/ocpi/cpo/versions (no auth)
    httpStatus: 401
    note: >-
      'www-authenticate: Token realm="OCPI"' with body
      {"error":"HTTP Token: Access denied."} — the commercial roaming interface,
      same host, same standard, completely closed.
  - call: GET https://char.gy/.well-known/openid-configuration
    httpStatus: 404
    note: No authorization server exists, so no consumer delegation is possible.

accessGate:
  gate: self-serve
  gateReasoning: >-
    Recorded as self-serve, and the word is being used in its strictest sense
    rather than its usual one. There is no signup because there is nothing to
    sign up for: no API key, no token, no account, no application form, no
    licence agreement, no click-through terms, no rate-limit registration and no
    quota. A developer obtains the data by issuing an HTTP GET. This is not
    generosity and should not be read as a developer-experience decision — it is
    the direct observable consequence of regulation 10(5) forbidding any
    requirement to agree to terms and conditions for this data. The gate is
    self-serve because the law made a gate unlawful.
  secondaryGate: partner-only
  secondaryGateNote: >-
    The commercial OCPI CPO roaming interface at https://char.gy/ocpi/cpo is
    partner-only. It requires being a charge point operator or e-mobility
    service provider, a commercial roaming agreement, and then an OCPI
    credentials handshake to obtain a Token. There is no published roaming terms
    page, no partner API page and no developer registration on char.gy — the
    /partners page is a local-authority and landowner marketing page, not a
    technical one. The only route in is a human conversation, and the only
    published address near the API surface is support@char.gy.
  tertiaryGate: customer-account-required
  tertiaryGateNote: >-
    A driver's own charging history is reachable only through the char.gy mobile
    app or the web account login at https://char.gy/users/sign_in. No API is
    documented behind that login and robots.txt disallows /account/, /users/
    and /webhooks/.
  whatADeveloperMustDo:
  - >-
    To read the documentation: nothing. Open
    https://help.char.gy/support/solutions/articles/77000576948-public-charge-point-regulations-2023
    anonymously. It is one short article and it is the complete published
    documentation.
  - >-
    To call the open API: nothing. `curl https://char.gy/open-ocpi/locations`
    and `curl https://char.gy/open-ocpi/tariffs` return 200 with no headers at
    all. Page with ?limit= and ?offset= or follow the Link rel="next" header.
    Expect the OCPI envelope and read status_code 1000 as success.
  - >-
    To call the roaming API: be a CPO or eMSP, negotiate a commercial roaming
    agreement with char.gy, complete the OCPI credentials handshake, and send
    `Authorization: Token <token>` against /ocpi/cpo/2.2.1/ or /ocpi/cpo/2.1.1/.
  - >-
    To obtain a driver's own usage data programmatically: there is no route. Not
    for the driver, not for a third party, not with consent. No such API exists
    and no British law requires one.

authModel:
  openDataApi:
    scheme: none
    observed: >-
      GET https://char.gy/open-ocpi/locations and /open-ocpi/tariffs both
      returned HTTP 200 to requests carrying no Authorization header, no cookie,
      no API key and no referer. No WWW-Authenticate header is present on the
      200 responses. Responses carry etag and cache-control
      "max-age=0, private, must-revalidate".
    scopes: none — there is no authorization layer of any kind on this surface
  ocpiCpoApi:
    scheme: OCPI Token authorization
    observed: >-
      Anonymous GET to https://char.gy/ocpi/cpo/versions returned HTTP 401 with
      response header `www-authenticate: Token realm="OCPI"` and body
      {"error":"HTTP Token: Access denied."} (38 bytes,
      content-type application/json). This is OCPI's own credentials-module
      Token scheme, established by a handshake between two operators.
    versionsAccepted: >-
      2.2.1 and 2.1.1 return 401 (auth required). 2.2 returns HTTP 200 with
      {"status_code":3002,"status_message":"Unsupported version"}.
    issuedBy: OCPI credentials exchange following a commercial roaming agreement
    scopes: none — OCPI does not use scopes; a Token grants the agreed module set
  noOpenIDConnect: >-
    https://char.gy/.well-known/openid-configuration returned HTTP 404 to an
    anonymous fetch on 2026-07-27. There is no OpenID Connect provider, no OAuth
    2.0 authorization server, no dynamic client registration, no PAR and no
    mTLS. The contrast with a mandated consumer-data regime is the whole story
    in one probe: a CDR data holder must run an authorization server, and
    char.gy — which has no consumer data obligation — runs none.
  driverAccount:
    scheme: session login (Rails)
    observed: >-
      https://char.gy/users/sign_in is allowed in robots.txt while /account/ and
      /users/ are disallowed. No API is documented behind it.

developerPortal:
  url: https://help.char.gy/support/solutions/articles/77000576948-public-charge-point-regulations-2023
  httpStatus: 200
  anonymous: true
  confirmed: false
  confirmationNote: >-
    Deliberately recorded as NOT confirmed, because there is no developer portal
    to confirm. What exists is a single Freshdesk knowledge-base article inside
    the customer help centre, roughly seventy words long, listing a host and two
    paths. It has no version, no schema, no field reference, no response
    example, no error table, no rate limits, no changelog, no console, no
    sandbox, no key management and no signup. There is no developer landing page
    anywhere on the domain: /developers, /api, /docs, /data, /open-data and
    /us/developers all returned 404, and developer.char.gy, developers.char.gy,
    docs.char.gy, api.char.gy, data.char.gy, ocpi.char.gy, portal.char.gy,
    app.char.gy, my.char.gy, account.char.gy, admin.char.gy and status.char.gy
    do not resolve in DNS at all. The API is genuinely open and genuinely
    self-serve; the documentation for it is a support ticket deflection article.
    Those two facts are recorded separately on purpose.
  discoveryPath: >-
    The article is not linked from any developer surface. It is reachable from
    the site footer under the label "Open Data and OCPI", and independently
    findable because https://char.gy/robots.txt discloses the existence of
    /ocpi/ and /api/ by disallowing them.

harvestedArtifacts: []
harvestedArtifactsNote: >-
  Nothing was saved to openapi/ because nothing exists to save. char.gy
  publishes no OpenAPI, Swagger, AsyncAPI, GraphQL or Postman artifact —
  https://char.gy/openapi.json, /swagger.json and /api-docs all returned 404,
  no spec is served under /open-ocpi, and the help-centre article carries no
  attachment. The only machine-readable contract-like thing on the domain is
  the OCPI standard itself at https://github.com/ocpi/ocpi, which is a
  third-party artifact and is linked as Specification rather than stored here.
  Writing an OpenAPI for the two open endpoints would have been derivation, not
  harvest, and is left to the enrichment pipeline.

