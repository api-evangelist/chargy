apis:
- aid: chargy:chargy-open-charge-point-data-api
  name: char.gy Open Charge Point Data API
  description: >-
    char.gy's statutory open data feed, published to satisfy Part 4 regulation
    10 of the UK Public Charge Point Regulations 2023, which requires reference
    data and availability data to be made available to the public free of
    charge, in a machine readable format, and without any requirement to agree
    to terms and conditions. It is shaped as an Open Charge Point Interface
    (OCPI) surface with exactly two modules exposed, both read-only GET and both
    completely unauthenticated. GET /open-ocpi/locations returned HTTP 200 and
    application/json to an anonymous request on 2026-07-27 with the OCPI
    envelope {data, status_code: 1000, status_message: "Success", timestamp},
    an x-total-count of 5409 locations, a default x-limit of 50, and an RFC 5988
    Link header advertising rel="next" — pagination is limit/offset via query
    string and was confirmed working at limit=2 and across offsets 0 to 550.
    Each location carries country_code GB, party_id CGY, a UUID id,
    parking_type (ON_STREET dominates, PARKING_LOT observed), publish, name,
    address, city, postal_code, country GBR, coordinates, an evses array, an
    operator block, an owner block naming the local authority, time_zone
    Europe/London, opening_times and last_updated. Every EVSE carries a uid, an
    evse_id of the form GB*CGY*E*00022, a status, capabilities
    (REMOTE_START_STOP_CAPABLE, UNLOCK_CAPABLE), a physical_reference and
    connectors describing IEC_62196_T2 sockets at AC_1_PHASE 230V/22A with
    tariff_ids and a terms_and_conditions link. GET /open-ocpi/tariffs returned
    HTTP 200 with 3 tariff objects carrying currency, elements and
    price_components of type ENERGY, including a real time-of-day tariff with
    weekday off-peak, weekday peak and weekend restrictions. No /open-ocpi
    /versions endpoint is served (404), so no OCPI version is declared, and the
    sessions, cdrs, tokens, commands and credentials modules are all 404 under
    /open-ocpi — only the two modules the regulation compels are open.
  humanURL: https://help.char.gy/support/solutions/articles/77000576948-public-charge-point-regulations-2023
  baseURL: https://char.gy/open-ocpi
