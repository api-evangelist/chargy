method: probed
source: >-
  Live payload and header inspection of https://char.gy/open-ocpi/* and
  https://char.gy/ocpi/cpo/*, plus
  https://www.legislation.gov.uk/uksi/2023/1168/regulation/10/made and
  https://raw.githubusercontent.com/ocpi/ocpi/release-2.2.1-bugfixes/mod_locations.asciidoc,
